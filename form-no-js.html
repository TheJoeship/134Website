        </nav>
        <h1>Contact Page</h1>
    </header>
    <main>
        <h2>Please feel free to shoot us a message if you've got something to say :)</h2>
            <form id="contact" method="GET" action="https://httpbin.org/anything">
                <fieldset>
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" pattern="[A-Za-z0-9 ]+" name="name" placeholder="Rick Deckard" required>

                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" placeholder="rdeckard@lapd.gov" required>

                    <label for="message">Your Message:</label>
                    <textarea name="message" id="message" maxlength="300" cols="60" rows="5" placeholder="Let us know what's up!"></textarea>

                    <input type="hidden" id="possible_bot" name="possible_bot" value="true">

                    <button type="submit">Submit</button>

                    <output id="error"></output>
                    <output id="charCount"></output>
                </fieldset>
            </form>
    </main>
</body>
</html>
